<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Daily Task Manager Cloud</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f6fb;
  color:#172033;
}

header{
  background:#155eef;
  color:white;
  padding:16px;
  position:sticky;
  top:0;
  z-index:5;
}

.wrap{
  max-width:1100px;
  margin:auto;
  padding:16px;
}

.brand{
  font-size:22px;
  font-weight:800;
}

.muted{
  color:#687386;
}

.card{
  background:white;
  border-radius:16px;
  padding:18px;
  margin:12px 0;
  box-shadow:0 4px 18px #0000000d;
}

input,
textarea,
select,
button{
  width:100%;
  padding:12px;
  border:1px solid #d6dce8;
  border-radius:10px;
  font-size:15px;
  margin-top:7px;
}

textarea{
  min-height:100px;
  resize:vertical;
}

button{
  background:#155eef;
  color:white;
  border:0;
  font-weight:700;
  cursor:pointer;
}

button.secondary{
  background:#eaf0ff;
  color:#155eef;
}

button.danger{
  background:#d92d20;
}

button.gray{
  background:#667085;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:12px;
}

.hidden{
  display:none!important;
}

.login-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:15px;
  margin-top:25px;
}

.login-card h2{
  margin-top:0;
}

.role{
  font-size:12px;
  background:#eef4ff;
  color:#155eef;
  padding:5px 8px;
  border-radius:20px;
  display:inline-block;
}

nav{
  display:flex;
  gap:8px;
  overflow:auto;
  padding:10px 0;
}

nav button{
  min-width:max-content;
  width:auto;
  padding:9px 14px;
}

.task{
  border:1px solid #e0e5ed;
  border-radius:14px;
  padding:14px;
  margin:10px 0;
}

.status{
  font-size:12px;
  font-weight:700;
  padding:5px 8px;
  border-radius:20px;
  background:#eef2f6;
  display:inline-block;
}

.status.assigned{
  background:#fff4d6;
}

.status.accepted{
  background:#e7f6ec;
}

.status.in_progress{
  background:#e7efff;
}

.status.completed{
  background:#e8f7f0;
}

.row{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.row>*{
  flex:1;
  min-width:130px;
}

.small{
  font-size:13px;
}

.topline{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:center;
  flex-wrap:wrap;
}

table{
  width:100%;
  border-collapse:collapse;
}

td,th{
  padding:9px;
  border-bottom:1px solid #edf0f5;
  text-align:left;
  font-size:13px;
}

#toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:#172033;
  color:white;
  padding:12px 18px;
  border-radius:12px;
  display:none;
  z-index:20;
  max-width:90%;
  text-align:center;
}

.user-id{
  display:inline-block;
  background:#eef4ff;
  color:#155eef;
  padding:5px 9px;
  border-radius:8px;
  font-weight:bold;
  font-size:12px;
}
</style>
</head>

<body>

<header>
  <div class="wrap">
    <div class="brand">☑ Daily Task Manager Cloud</div>
    <div id="headerUser" class="small"></div>
  </div>
</header>


<!-- LOGIN -->
<div id="authScreen" class="wrap">

  <div class="card">

    <h1>Secure Login</h1>

    <p class="muted">
      Choose your account type.
    </p>

    <div class="login-grid">

      <!-- SUPER USER -->
      <div class="card login-card">

        <span class="role">HIGHEST ACCESS</span>

        <h2>Super User</h2>

        <input
          id="suUser"
          placeholder="Super User username"
          autocomplete="username"
        >

        <input
          id="suPass"
          type="password"
          placeholder="Password"
          autocomplete="current-password"
        >

        <button onclick="login('super_user')">
          Login as Super User
        </button>

      </div>


      <!-- ADMIN -->
      <div class="card login-card">

        <span class="role">MANAGEMENT</span>

        <h2>Admin</h2>

        <input
          id="adUser"
          placeholder="Admin username"
          autocomplete="username"
        >

        <input
          id="adPass"
          type="password"
          placeholder="Password"
          autocomplete="current-password"
        >

        <button onclick="login('admin')">
          Login as Admin
        </button>

      </div>


      <!-- END USER -->
      <div class="card login-card">

        <span class="role">END USER</span>

        <h2>End User</h2>

        <input
          id="usUser"
          placeholder="Username"
          autocomplete="username"
        >

        <input
          id="usPass"
          type="password"
          placeholder="Password"
          autocomplete="current-password"
        >

        <button onclick="login('user')">
          Login as End User
        </button>

      </div>

    </div>
  </div>


  <div class="card">

    <h3>New account</h3>

    <p class="muted">
      Admins and End Users can be created through the management system.
    </p>

    <button
      class="secondary"
      onclick="showSignup()"
    >
      Create account with invite
    </button>

  </div>

</div>


<!-- SIGNUP -->
<div id="signupScreen" class="wrap hidden">

  <div class="card">

    <h2>Create Account</h2>

    <p class="muted">
      Enter the invite code given by your manager.
    </p>

    <input
      id="inviteCode"
      placeholder="Invite code"
    >

    <button
      class="secondary"
      onclick="checkInvite()"
    >
      Check Invite
    </button>

    <div
      id="inviteInfo"
      class="card hidden"
    ></div>


    <div id="signupFields" class="hidden">

      <input
        id="newName"
        placeholder="Full name"
      >

      <input
        id="newUser"
        placeholder="Username"
      >

      <input
        id="newPass"
        type="password"
        placeholder="Password (8+ characters)"
      >

      <input
        id="newPass2"
        type="password"
        placeholder="Confirm password"
      >

      <button onclick="signup()">
        Create Account
      </button>

    </div>


    <button
      class="gray"
      onclick="showLogin()"
    >
      Back to Login
    </button>

  </div>

</div>


<!-- APP -->
<div id="app" class="hidden">

  <div class="wrap">

    <div class="card topline">

      <div>

        <b id="welcome"></b>

        <div
          id="roleText"
          class="muted"
        ></div>

        <div
          id="myUserId"
          class="user-id"
          style="margin-top:7px"
        ></div>

      </div>

      <button
        class="danger"
        style="width:auto"
        onclick="logout()"
      >
        Logout
      </button>

    </div>


    <nav id="nav"></nav>

    <main id="content"></main>

  </div>

</div>


<div id="toast"></div>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
"https://egphfcjehcygjcabugbo.supabase.co";

const SUPABASE_KEY =
"sb_publishable_ZPa3kwOHSIi__aihHVbg6w_VM-nkn-h";

const sb =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================================================
   GLOBAL VARIABLES
========================================================= */

let me = null;
let tasks = [];
let users = [];
let currentTab = "dashboard";
let refreshTimer = null;


/* =========================================================
   HELPERS
========================================================= */

const $ = id =>
document.getElementById(id);


function toast(message){

  const box = $("toast");

  box.textContent = message;

  box.style.display = "block";

  setTimeout(()=>{
    box.style.display = "none";
  },3000);

}


function esc(value){

  return String(value ?? "")
    .replace(/[&<>"']/g,c=>({

      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"

    }[c]));

}


function fmt(value){

  if(!value) return "—";

  return new Date(value).toLocaleString();

}


function secondsText(seconds){

  seconds =
  Math.max(
    0,
    Number(seconds) || 0
  );

  const h =
  Math.floor(seconds / 3600);

  const m =
  Math.floor(
    (seconds % 3600) / 60
  );

  const s =
  Math.floor(seconds % 60);

  return `${h}h ${m}m ${s}s`;

}


/* =========================================================
   SCREEN CONTROL
========================================================= */

function showLogin(){

  $("signupScreen")
    .classList
    .add("hidden");

  $("authScreen")
    .classList
    .remove("hidden");

}


function showSignup(){

  $("authScreen")
    .classList
    .add("hidden");

  $("signupScreen")
    .classList
    .remove("hidden");

}


/* =========================================================
   IMPORTANT:
   LOAD CURRENT USER PROFILE THROUGH RPC
========================================================= */

async function getMyProfile(){

  const {
    data:sessionData,
    error:sessionError
  } =
  await sb.auth.getSession();

  if(sessionError)
    throw sessionError;

  const session =
  sessionData?.session;

  if(!session?.user?.id){

    throw new Error(
      "No active session"
    );

  }


  const {
    data,
    error
  } =
  await sb.rpc(
    "get_my_profile",
    {
      p_user_id:
      session.user.id
    }
  );


  if(error)
    throw error;


  if(!data){

    throw new Error(
      "Profile not found"
    );

  }


  return data;

}


/* =========================================================
   LOGIN
========================================================= */

async function login(expectedRole){

  const username =
  $(
    expectedRole === "super_user"
      ? "suUser"
      : expectedRole === "admin"
      ? "adUser"
      : "usUser"
  )
  .value
  .trim()
  .toLowerCase();


  const password =
  $(
    expectedRole === "super_user"
      ? "suPass"
      : expectedRole === "admin"
      ? "adPass"
      : "usPass"
  )
  .value;


  if(!username || !password){

    toast(
      "Username and password required"
    );

    return;

  }


  toast("Signing in...");


  const {
    error
  } =
  await sb.auth.signInWithPassword({

    email:
    username +
    "@taskmanager.local",

    password:
    password

  });


  if(error){

    toast(error.message);

    return;

  }


  try{

    /*
      NEW SECURE PROFILE METHOD
    */

    me =
    await getMyProfile();


    if(!me){

      await sb.auth.signOut();

      toast(
        "Profile could not be loaded"
      );

      return;

    }


    if(!me.is_active){

      await sb.auth.signOut();

      toast(
        "This account is deactivated"
      );

      return;

    }


    if(me.role !== expectedRole){

      await sb.auth.signOut();

      toast(
        "Wrong login portal for this account"
      );

      return;

    }


    openApp();

  }
  catch(error){

    console.error(
      "PROFILE ERROR:",
      error
    );


    await sb.auth.signOut();


    toast(
      "Profile could not be loaded: " +
      error.message
    );

  }

}


/* =========================================================
   OPEN APP
========================================================= */

async function openApp(){

  $("authScreen")
    .classList
    .add("hidden");

  $("signupScreen")
    .classList
    .add("hidden");

  $("app")
    .classList
    .remove("hidden");


  $("welcome").textContent =
  "Welcome, " +
  (
    me.full_name ||
    me.username
  );


  $("roleText").textContent =
  me.role === "super_user"
    ? "Super User"
    : me.role === "admin"
    ? "Admin"
    : "End User";


  $("myUserId").textContent =
  "User ID: " +
  (me.user_id || "—");


  $("headerUser").textContent =
  me.username
  ? "Logged in as @" + me.username
  : "";


  buildNav();

  await refresh();


  if(refreshTimer)
    clearInterval(refreshTimer);


  refreshTimer =
  setInterval(
    refresh,
    30000
  );

}


/* =========================================================
   NAVIGATION
========================================================= */

function buildNav(){

  let items;


  if(me.role === "user"){

    items = [
      "dashboard",
      "history"
    ];

  }
  else{

    items = [
      "dashboard",
      "users",
      "reports",
      "history"
    ];

  }


  $("nav").innerHTML =
  items
  .map(tab=>`

    <button
      class="${tab === currentTab ? "" : "secondary"}"
      onclick="
        currentTab='${tab}';
        render();
      "
    >
      ${
        tab.charAt(0).toUpperCase()
        +
        tab.slice(1)
      }
    </button>

  `)
  .join("");

}


/* =========================================================
   REFRESH DATA
========================================================= */

async function refresh(){

  /*
    TASKS
  */

  const {
    data:taskData,
    error:taskError
  } =
  await sb
    .from("daily_tasks")
    .select("*")
    .order(
      "due_at",
      {
        ascending:true,
        nullsFirst:false
      }
    );


  if(taskError){

    console.error(
      "TASK ERROR:",
      taskError
    );

  }
  else{

    tasks =
    taskData || [];

  }


  /*
    USERS
  */

  if(me.role !== "user"){

    const {
      data:userData,
      error:userError
    } =
    await sb
      .from("profiles")
      .select(
        "id,user_id,username,full_name,role,is_active,workspace_id,created_at,created_by"
      )
      .order(
        "created_at",
        {
          ascending:false
        }
      );


    if(userError){

      console.error(
        "USER ERROR:",
        userError
      );

    }
    else{

      users =
      userData || [];

    }

  }


  render();

}


/* =========================================================
   RENDER
========================================================= */

function render(){

  buildNav();


  const content =
  $("content");


  if(currentTab === "dashboard"){

    renderDashboard(content);

  }
  else if(currentTab === "history"){

    renderHistory(content);

  }
  else if(currentTab === "users"){

    renderUsers(content);

  }
  else if(currentTab === "reports"){

    renderReports(content);

  }

}


/* =========================================================
   DASHBOARD
========================================================= */

function renderDashboard(content){

  let list;


  if(me.role === "user"){

    list =
    tasks.filter(
      task =>
      task.assigned_to === me.id
    );

  }
  else{

    list = tasks;

  }


  content.innerHTML = `

    <div class="topline">

      <h2>Dashboard</h2>

      ${
        me.role !== "user"
        ?
        `
        <button
          style="width:auto"
          onclick="taskForm()"
        >
          + Assign Task
        </button>
        `
        :
        ""
      }

    </div>

  `;


  if(me.role === "user"){

    content.innerHTML += `

      <div class="card">

        <b>
          My Tasks: ${list.length}
        </b>

        <div class="muted">
          Assigned → Accepted → In Progress → Completed
        </div>

      </div>

    `;

  }


  if(!list.length){

    content.innerHTML += `

      <div class="card">
        No tasks found.
      </div>

    `;

  }


  list.forEach(task=>{

    content.innerHTML +=
    taskCard(task);

  });

}


/* =========================================================
   TASK CARD
========================================================= */

function taskCard(task){

  const assignedUser =
  users.find(
    u =>
    u.id === task.assigned_to
  );


  const creator =
  users.find(
    u =>
    u.id === task.assigned_by
  );


  let buttons = "";


  if(me.role === "user"){

    if(task.status === "assigned"){

      buttons += `

        <button
          onclick="
            taskAction(
              '${task.id}',
              'accept_task'
            )
          "
        >
          Accept
        </button>

      `;

    }


    if(task.status === "accepted"){

      buttons += `

        <button
          onclick="
            taskAction(
              '${task.id}',
              'start_task'
            )
          "
        >
          Start
        </button>

      `;

    }


    if(task.status === "in_progress"){

      buttons += `

        <button
          onclick="
            taskAction(
              '${task.id}',
              'complete_task'
            )
          "
        >
          End / Complete
        </button>

      `;

    }

  }
  else{

    buttons = `

      <button
        class="secondary"
        onclick="
          taskForm('${task.id}')
        "
      >
        Edit
      </button>

      <button
        class="danger"
        onclick="
          deleteTask('${task.id}')
        "
      >
        Delete
      </button>

    `;

  }


  const completedTime =
  task.completed_at ||
  task.ended_at;


  const workingSeconds =
  task.total_work_seconds ??
  task.total_working_time ??
  0;


  return `

    <div class="task">

      <div class="topline">

        <h3>
          ${esc(task.name)}
        </h3>

        <span
          class="status ${esc(task.status)}"
        >
          ${esc(
            String(task.status || "")
            .replaceAll("_"," ")
          )}
        </span>

      </div>


      <p>
        ${esc(
          task.description ||
          "No description"
        )}
      </p>


      <div class="small muted">

        Assigned to:
        ${esc(
          assignedUser?.full_name ||
          assignedUser?.username ||
          "—"
        )}

        ·

        By:
        ${esc(
          creator?.full_name ||
          creator?.username ||
          "—"
        )}

      </div>


      <div class="small muted">

        Due:
        ${
          task.due_at
          ?
          new Date(
            task.due_at
          ).toLocaleString()
          :
          "No due time"
        }

      </div>


      <div class="small">

        Accepted:
        ${fmt(task.accepted_at)}

        ·

        Started:
        ${fmt(task.started_at)}

        ·

        Completed:
        ${fmt(completedTime)}

      </div>


      <div class="small">

        <b>Working time:</b>

        ${secondsText(
          workingSeconds
        )}

      </div>


      <div
        class="row"
        style="margin-top:10px"
      >

        ${buttons}

      </div>

    </div>

  `;

}


/* =========================================================
   HISTORY
========================================================= */

function renderHistory(content){

  let list;


  if(me.role === "user"){

    list =
    tasks.filter(
      task =>
      task.assigned_to === me.id
    );

  }
  else{

    list = tasks;

  }


  content.innerHTML =
  "<h2>Task History</h2>";


  if(!list.length){

    content.innerHTML += `

      <div class="card">
        No history.
      </div>

    `;

    return;

  }


  list.forEach(task=>{

    const endTime =
    task.completed_at ||
    task.ended_at;


    const working =
    task.total_work_seconds ??
    task.total_working_time ??
    0;


    content.innerHTML += `

      <div class="card">

        <b>
          ${esc(task.name)}
        </b>

        —

        ${esc(task.status)}

        <br>

        <span class="small muted">

          Created:
          ${fmt(task.created_at)}

          ·

          Completed:
          ${fmt(endTime)}

          ·

          Working:
          ${secondsText(working)}

        </span>

      </div>

    `;

  });

}


/* =========================================================
   USERS
========================================================= */

function renderUsers(content){

  content.innerHTML = `

    <div class="topline">

      <h2>
        ${
          me.role === "super_user"
          ?
          "Users & Admin Management"
          :
          "Users"
        }
      </h2>


      <div class="row">

        ${
          me.role === "super_user"
          ?
          `
          <button
            style="width:auto"
            onclick="
              inviteForm('admin')
            "
          >
            + Create Admin Invite
          </button>
          `
          :
          ""
        }


        <button
          style="width:auto"
          onclick="
            inviteForm('user')
          "
        >
          + Create User Invite
        </button>

      </div>

    </div>

  `;


  content.innerHTML += `

    <div class="card">

      <div style="overflow:auto">

        <table>

          <tr>

            <th>User ID</th>
            <th>Name</th>
            <th>Username</th>
            <th>Role</th>
            <th>Status</th>
            <th>Action</th>

          </tr>

          ${
            users
            .map(user=>`

              <tr>

                <td>
                  ${esc(
                    user.user_id || "—"
                  )}
                </td>

                <td>
                  ${esc(
                    user.full_name
                  )}
                </td>

                <td>
                  ${esc(
                    user.username
                  )}
                </td>

                <td>
                  ${esc(
                    user.role
                  )}
                </td>

                <td>

                  ${
                    user.is_active
                    ?
                    "Active"
                    :
                    "Inactive"
                  }

                </td>

                <td>

                  ${
                    user.id === me.id
                    ?
                    "You"
                    :
                    (
                      me.role === "super_user" ||
                      user.role === "user"
                    )
                    ?
                    `
                    <button
                      onclick="
                        toggleUser(
                          '${user.id}',
                          ${!user.is_active}
                        )
                      "
                    >
                      ${
                        user.is_active
                        ?
                        "Deactivate"
                        :
                        "Activate"
                      }
                    </button>
                    `
                    :
                    ""
                  }

                </td>

              </tr>

            `)
            .join("")
          }

        </table>

      </div>

    </div>

  `;

}


/* =========================================================
   REPORTS
========================================================= */

function renderReports(content){

  const total =
  tasks.length;


  const completed =
  tasks.filter(
    x =>
    x.status === "completed"
  ).length;


  const inProgress =
  tasks.filter(
    x =>
    x.status === "in_progress"
  ).length;


  const totalSeconds =
  tasks.reduce(
    (sum,x)=>
    sum +
    Number(
      x.total_work_seconds ??
      x.total_working_time ??
      0
    ),
    0
  );


  content.innerHTML = `

    <h2>Reports</h2>

    <div class="grid">

      <div class="card">
        <b>Total Tasks</b>
        <h2>${total}</h2>
      </div>

      <div class="card">
        <b>Completed</b>
        <h2>${completed}</h2>
      </div>

      <div class="card">
        <b>In Progress</b>
        <h2>${inProgress}</h2>
      </div>

      <div class="card">
        <b>Total Working Time</b>
        <h2>
          ${secondsText(totalSeconds)}
        </h2>
      </div>

    </div>

  `;


  if(me.role === "super_user"){

    content.innerHTML += `

      <div class="card">

        <h3>System Summary</h3>

        Users:
        ${users.length}

        <br>

        Admins:
        ${
          users.filter(
            x =>
            x.role === "admin"
          ).length
        }

        <br>

        End Users:
        ${
          users.filter(
            x =>
            x.role === "user"
          ).length
        }

        <br>

        Active:
        ${
          users.filter(
            x =>
            x.is_active
          ).length
        }

      </div>

    `;

  }

}


/* =========================================================
   TASK FORM
========================================================= */

async function taskForm(id){

  const task =
  id
  ?
  tasks.find(
    x =>
    x.id === id
  )
  :
  null;


  const eligibleUsers =
  users.filter(
    user =>
    user.role === "user" &&
    user.is_active
  );


  if(!eligibleUsers.length){

    toast(
      "Create an active End User first"
    );

    return;

  }


  const box =
  document.createElement(
    "div"
  );


  box.className =
  "card";


  box.innerHTML = `

    <h2>
      ${
        task
        ?
        "Edit Task"
        :
        "Assign Task"
      }
    </h2>


    <input
      id="tfName"
      placeholder="Task title"
      value="${esc(
        task?.name || ""
      )}"
    >


    <textarea
      id="tfDesc"
      placeholder="Detailed description / instructions"
    >${esc(
      task?.description || ""
    )}</textarea>


    <select id="tfUser">

      ${
        eligibleUsers
        .map(user=>`

          <option
            value="${user.id}"
            ${
              user.id ===
              task?.assigned_to
              ?
              "selected"
              :
              ""
            }
          >

            ${esc(
              user.full_name ||
              user.username
            )}

          </option>

        `)
        .join("")
      }

    </select>


    <input
      id="tfDue"
      type="datetime-local"
      value="${
        task?.due_at
        ?
        new Date(
          task.due_at
        )
        .toISOString()
        .slice(0,16)
        :
        ""
      }"
    >


    <div class="row">

      <button
        onclick="
          saveTask(
            '${id || ""}'
          )
        "
      >
        Save
      </button>


      <button
        class="gray"
        onclick="render()"
      >
        Cancel
      </button>

    </div>

  `;


  $("content")
    .prepend(box);


  window.scrollTo(
    0,
    0
  );

}


/* =========================================================
   SAVE TASK
========================================================= */

async function saveTask(id){

  const name =
  $("tfName")
  .value
  .trim();


  const description =
  $("tfDesc")
  .value
  .trim();


  const assignedTo =
  $("tfUser")
  .value;


  const due =
  $("tfDue")
  .value;


  if(!name){

    toast(
      "Task title required"
    );

    return;

  }


  const taskData = {

    name:name,

    description:
    description,

    assigned_to:
    assignedTo,

    due_at:
    due
    ?
    new Date(
      due
    ).toISOString()
    :
    null

  };


  let result;


  if(id){

    result =
    await sb
      .from("daily_tasks")
      .update(
        taskData
      )
      .eq(
        "id",
        id
      );

  }
  else{

    result =
    await sb
      .from("daily_tasks")
      .insert({

        ...taskData,

        workspace_id:
        me.workspace_id,

        assigned_by:
        me.id,

        status:
        "assigned"

      });

  }


  if(result.error){

    toast(
      result.error.message
    );

    return;

  }


  toast(
    "Task saved successfully"
  );


  await refresh();

}


/* =========================================================
   DELETE TASK
========================================================= */

async function deleteTask(id){

  if(
    !confirm(
      "Delete this task?"
    )
  )
  return;


  const result =
  await sb
    .from("daily_tasks")
    .delete()
    .eq(
      "id",
      id
    );


  if(result.error){

    toast(
      result.error.message
    );

    return;

  }


  toast(
    "Task deleted"
  );


  await refresh();

}


/* =========================================================
   TASK ACTION
========================================================= */

async function taskAction(
  taskId,
  functionName
){

  const result =
  await sb.rpc(
    functionName,
    {
      p_task_id:
      taskId
    }
  );


  if(result.error){

    toast(
      result.error.message
    );

    return;

  }


  toast(
    "Task updated"
  );


  await refresh();

}


/* =========================================================
   USER ACTIVE / INACTIVE
========================================================= */

async function toggleUser(
  id,
  active
){

  const result =
  await sb
    .from("profiles")
    .update({
      is_active:
      active
    })
    .eq(
      "id",
      id
    );


  if(result.error){

    toast(
      result.error.message
    );

    return;

  }


  toast(
    active
    ?
    "User activated"
    :
    "User deactivated"
  );


  await refresh();

}


/* =========================================================
   INVITE
========================================================= */

async function inviteForm(role){

  const code =
  Math.random()
    .toString(36)
    .slice(2,8)
    .toUpperCase();


  const days =
  prompt(
    "Invite valid for how many days?",
    "7"
  );


  if(days === null)
    return;


  const result =
  await sb.rpc(
    "create_invite",
    {
      p_role:
      role,

      p_code:
      code,

      p_days:
      Number(days) || 7
    }
  );


  if(result.error){

    toast(
      result.error.message
    );

    return;

  }


  alert(

    "Invite created\n\n" +

    "Role: " +
    role +
    "\n\n" +

    "Code: " +
    code +
    "\n\n" +

    "Give this code to the new user."

  );

}


/* =========================================================
   CHECK INVITE
========================================================= */

async function checkInvite(){

  const code =
  $("inviteCode")
  .value
  .trim()
  .toUpperCase();


  if(!code){

    toast(
      "Enter invite code"
    );

    return;

  }


  const result =
  await sb.rpc(
    "check_invite",
    {
      p_code:
      code
    }
  );


  if(
    result.error ||
    !result.data ||
    !result.data.length
  ){

    toast(
      "Invalid, expired or used invite"
    );

    return;

  }


  const info =
  result.data[0];


  $("inviteInfo")
    .classList
    .remove("hidden");


  $("inviteInfo")
    .innerHTML = `

      <b>Invite valid</b>

      <br>

      Role:
      ${esc(info.role)}

      <br>

      Workspace:
      ${esc(
        info.workspace_name ||
        "Default"
      )}

    `;


  $("signupFields")
    .classList
    .remove("hidden");

}


/* =========================================================
   SIGNUP
========================================================= */

async function signup(){

  const code =
  $("inviteCode")
  .value
  .trim()
  .toUpperCase();


  const name =
  $("newName")
  .value
  .trim();


  const username =
  $("newUser")
  .value
  .trim()
  .toLowerCase();


  const password =
  $("newPass")
  .value;


  const password2 =
  $("newPass2")
  .value;


  if(
    !name ||
    !username ||
    password.length < 8 ||
    password !== password2
  ){

    toast(
      "Check name and password"
    );

    return;

  }


  const check =
  await sb.rpc(
    "check_invite",
    {
      p_code:
      code
    }
  );


  if(
    check.error ||
    !check.data ||
    !check.data.length
  ){

    toast(
      "Invite is no longer valid"
    );

    return;

  }


  const signupResult =
  await sb.auth.signUp({

    email:
    username +
    "@taskmanager.local",

    password:
    password

  });


  if(signupResult.error){

    toast(
      signupResult.error.message
    );

    return;

  }


  const complete =
  await sb.rpc(
    "complete_invite",
    {

      p_code:
      code,

      p_user_id:
      signupResult.data.user.id,

      p_username:
      username,

      p_full_name:
      name

    }
  );


  await sb.auth.signOut();


  if(complete.error){

    toast(
      complete.error.message
    );

    return;

  }


  toast(
    "Account created successfully"
  );


  showLogin();

}


/* =========================================================
   LOGOUT
========================================================= */

async function logout(){

  if(refreshTimer){

    clearInterval(
      refreshTimer
    );

    refreshTimer = null;

  }


  await sb.auth.signOut();

  location.reload();

}


/* =========================================================
   RESTORE SESSION
   ALSO USES NEW RPC
========================================================= */

(async function(){

  try{

    const {
      data
    } =
    await sb.auth.getSession();


    if(!data?.session)
      return;


    try{

      me =
      await getMyProfile();


      if(
        me &&
        me.is_active
      ){

        openApp();

      }
      else{

        await sb.auth.signOut();

      }

    }
    catch(error){

      console.error(
        "SESSION PROFILE ERROR:",
        error
      );

      await sb.auth.signOut();

    }

  }
  catch(error){

    console.error(
      "STARTUP ERROR:",
      error
    );

  }

})();
